[project]
name = "learn-flask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kayesFerdous", email = "kayesfardows@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-smorest>=0.47.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.1.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
server = "learn_flask.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
]
